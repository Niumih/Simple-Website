<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My PDF Editor & Signer</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; }
        label { display: block; margin: 10px 0 5px; }
        button { padding: 10px; background: #007bff; color: white; border: none; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <h1>Edit & Sign PDF</h1>
    <form id="pdfForm">
        <label for="pdf">Upload PDF:</label>
        <input type="file" id="pdf" name="pdf" accept=".pdf" required>

        <label for="edits">Edits (JSON, e.g. {"OldText": "NewText"}):</label>
        <textarea id="edits" name="edits" rows="4" cols="50" placeholder='{"Name": "John", "Date": "2023-10-01"}' required></textarea>

        <label for="signature_type">Signature Type:</label>
        <select id="signature_type" name="signature_type">
            <option value="text">Text</option>
            <option value="image">Upload Image</option>
        </select>

        <div id="text_sig" style="display: block;">
            <label for="signature_text">Signature Text:</label>
            <input type="text" id="signature_text" name="signature_text" placeholder="e.g., John Doe">
        </div>

        <div id="image_sig" style="display: none;">
            <label for="signature_image">Upload Signature Image (PNG/JPG):</label>
            <input type="file" id="signature_image" name="signature_image" accept="image/*">
        </div>

        <label for="sig_position">Signature Position:</label>
        <select id="sig_position" name="sig_position" required>
            <option value="">Choose...</option>
            <option value="bottom_left">Bottom Left</option>
            <option value="bottom_center">Bottom Center</option>
            <option value="bottom_right">Bottom Right</option>
            <option value="top_right">Top Right</option>
        </select>

        <label for="email">Email (optional):</label>
        <input type="email" id="email" name="email">

        <button type="submit" id="submitBtn">Process PDF</button>
    </form>

    <script>
        const form = document.getElementById('pdfForm');
        const submitBtn = document.getElementById('submitBtn');
        const sigType = document.getElementById('signature_type');
        const textSig = document.getElementById('text_sig');
        const imageSig = document.getElementById('image_sig');

        sigType.addEventListener('change', () => {
            textSig.style.display = sigType.value === 'text' ? 'block' : 'none';
            imageSig.style.display = sigType.value === 'image' ? 'block' : 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            const formData = new FormData(form);
            try {
                const response = await fetch('YOUR_N8N_WEBHOOK_URL', { // URL
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'edited_signed.pdf';
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    alert('PDF ready! Download started.');
                } else {
                    alert('Error: ' + await response.text());
                }
            } catch (error) {
                alert('Connection failed: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Process PDF';
            }
        });
    </script>
</body>
</html>
