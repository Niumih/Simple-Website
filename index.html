<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My PDF Editor & Signer Portal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
        label { display: block; margin: 15px 0 5px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Edit, Sign, and Send PDF</h1>

    <form id="pdfForm">
        <label for="pdf">Upload PDF:</label>
        <input type="file" id="pdf" name="pdf" accept=".pdf" required>

        <label for="edits">Edits (valid JSON, e.g. {"Name": "John", "Date": "2025-02-20"}):</label>
        <textarea id="edits" name="edits" rows="4" cols="50" placeholder='{"Name": "John Doe", "Date": "2025-02-20"}' required></textarea>

        <label for="signature">Signature (Text or Image URL):</label>
        <input type="text" id="signature" name="signature" placeholder="John Doe or https://example.com/sig.png" required>

        <label for="sig_position">Signature Position (Page,X,Y e.g. "1,150,650"):</label>
        <input type="text" id="sig_position" name="sig_position" placeholder="1,150,650" required>

        <label for="email">Recipient Email (optional – PDF will download anyway):</label>
        <input type="email" id="email" name="email">

        <button type="submit" id="submitBtn">Process PDF</button>
    </form>

    <script>
        const form = document.getElementById('pdfForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            const formData = new FormData(form);

            try {
                const response = await fetch(
                    'https://niumih.app.n8n.cloud/webhook/637bc509-d0e3-4d7d-b6c5-220fffdb88ca',   // ← REPLACE THIS WITH YOUR REAL N8N WEBHOOK URL
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'edited_signed.pdf';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    alert('PDF processed! Download started.');
                } else {
                    const errorText = await response.text();
                    alert('Server error: ' + errorText);
                }
            } catch (error) {
                alert('Connection failed: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Process PDF';
            }
        });
    </script>
</body>
</html>
